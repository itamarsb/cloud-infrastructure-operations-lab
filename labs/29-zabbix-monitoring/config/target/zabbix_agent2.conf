# LAB 29 - Agente do alvo Linux

# Envia os logs para a saida do container.
LogType=console

# Permite consultas provenientes do servidor deste laboratorio.
Server=zabbix-server

# Escuta nas interfaces do container.
ListenIP=0.0.0.0
ListenPort=10050

# Utiliza o hostname do container como identificacao.
HostnameItem=system.hostname

# Limita o tempo das verificacoes.
Timeout=3

# Arquivos temporarios internos do container.
PidFile=/tmp/zabbix_agent2.pid
ControlSocket=/tmp/zabbix_agent2.sock
