# LAB 29 - Servico HTTP do alvo Linux

worker_processes 1;
pid /tmp/lab29-nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    default_type text/plain;
    access_log /dev/stdout;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        location = / {
            return 200 "LAB 29 - HTTP service running\n";
        }

        location = /health {
            return 200 "healthy\n";
        }

        location / {
            return 404 "not found\n";
        }
    }
}
