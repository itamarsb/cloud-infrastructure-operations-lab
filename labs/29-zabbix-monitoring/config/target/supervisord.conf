; LAB 29 - Controle dos processos do alvo Linux

[unix_http_server]
file=/tmp/lab29-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/lab29-supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/lab29-supervisor.sock

[program:zabbix-agent]
command=/usr/sbin/zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf
user=zabbix
autostart=true
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=false
startsecs=3
startretries=3
stopsignal=QUIT
stopwaitsecs=10
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
